<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page_title }}</title>
<meta name="description" content="{{ og_description }}">

<meta property="og:site_name" content="Muslim 360">
<meta property="og:title" content="{{ masjid_name }}">
<meta property="og:description" content="{{ og_description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:image" content="{{ og_image_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ masjid_name }}">
<meta name="twitter:description" content="{{ og_description }}">
<meta name="twitter:image" content="{{ og_image_url }}">

<style>
  :root{--ink:#091914;--muted:#5D6C67;--bg:#F2F3F5}
  *{box-sizing:border-box}
  body{margin:0;background:#fff}
  .wrap{text-align:center;max-width:340px}
  .name{font-size:18px;font-weight:700;margin:0 0 6px}
  .muted{color:var(--muted);font-size:14px;margin:0 0 18px}
  .cta{display:inline-block;border-radius:12px;padding:12px 18px;
    font-size:14px;font-weight:700;color:#091914;text-decoration:none;
    background:linear-gradient(180deg,#61D47D,#ADFF8D);
    box-shadow:0 2px 8px rgba(0,0,0,.1), inset 0 4px 4px rgba(255,255,255,.25)}
</style>
</head>
<body>
<noscript><meta http-equiv="refresh" content="0;url={{ play_store_referrer_url }}"></noscript>
<script>
  var PLAY_STORE_URL = {{ play_store_referrer_url | tojson }};
  var APP_STORE_URL = {{ app_store_url | tojson }};
  var ANDROID_PKG = {{ android_package | tojson }};
  var SHARE_HOST = {{ share_host | tojson }};
  var SHARE_ORIGIN = {{ share_origin | tojson }};
  var SHARE_SCHEME = SHARE_ORIGIN.indexOf("://") >= 0
    ? SHARE_ORIGIN.split("://")[0]
    : "https";
  var MASJID_ID = {{ masjid_id | tojson }};

  var UA = navigator.userAgent || "";
  var IS_ANDROID = /android/i.test(UA);
  var IS_IOS = /iphone|ipad|ipod/i.test(UA) ||
    (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);

  // No visible page: open the app when it is installed, otherwise go straight
  // to the store. The Play URL carries the deferred referrer so a fresh
  // install still lands on this masjid's PDP.
  if (IS_ANDROID) {
    window.location.replace(
      "intent://" + SHARE_HOST + "/m/" + MASJID_ID +
      "#Intent;scheme=" + SHARE_SCHEME + ";package=" + ANDROID_PKG +
      ";S.browser_fallback_url=" + encodeURIComponent(PLAY_STORE_URL) +
      ";end"
    );
  } else {
    window.location.replace(IS_IOS ? APP_STORE_URL : PLAY_STORE_URL);
  }
</script>
</body>
</html>
