<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page_title }}</title>
<meta name="description" content="{{ og_description }}">

<meta property="og:site_name" content="Muslim 360">
<meta property="og:title" content="{{ masjid_name }}">
<meta property="og:description" content="{{ og_description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:image" content="{{ og_image_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ masjid_name }}">
<meta name="twitter:description" content="{{ og_description }}">
<meta name="twitter:image" content="{{ og_image_url }}">

<style>
  :root{--green:#45D07C;--ink:#091914;--muted:#5D6C67;--line:#EDEFF1;--bg:#F2F3F5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:-apple-system,"Plus Jakarta Sans",system-ui,Segoe UI,Roboto,sans-serif}
  .card{width:100%;max-width:420px;background:#fff;border-radius:20px;
    overflow:hidden;box-shadow:0 8px 32px rgba(9,25,20,.10)}
  .cover{height:180px;background:#0c1813;position:relative}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .body{padding:20px 20px 24px}
  .name{display:flex;align-items:center;gap:6px;font-size:22px;
    font-weight:800;line-height:1.25;margin:0}
  .vbadge{width:18px;height:18px;fill:#4D80C9;flex:0 0 18px}
  .loc{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
  .cta{display:block;width:100%;margin-top:22px;border:0;border-radius:12px;
    padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer;
    font-family:inherit;color:#091914;
    background:linear-gradient(180deg,#61D47D,#ADFF8D);
    box-shadow:0 2px 8px rgba(0,0,0,.1), inset 0 4px 4px rgba(255,255,255,.25)}
  .secondary{display:block;width:100%;margin-top:10px;border:0;border-radius:12px;
    padding:12px 16px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:inherit;color:#091914;background:#E5F1E8}
  .home{display:block;text-align:center;margin-top:18px;font-size:13px;
    color:var(--muted);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="cover">
    <img src="{{ masjid_avatar_url }}" alt="" decoding="async">
  </div>
  <div class="body">
    <h1 class="name">{{ masjid_name }}
      {% if masjid_verified %}<svg class="vbadge" viewBox="0 0 24 24" aria-label="Verified"><path d="M12 2l2.4 2.1 3.1-.5.9 3 2.9 1.3-1.3 2.9 1.3 2.9-2.9 1.3-.9 3-3.1-.5L12 22l-2.4-2.1-3.1-.5-.9-3-2.9-1.3 1.3-2.9L1.7 8l2.9-1.3.9-3 3.1.5z"/><path d="M10.6 14.6l-2.2-2.2-1.4 1.4 3.6 3.6 6-6-1.4-1.4z" fill="#fff"/></svg>{% endif %}
    </h1>
    {% if masjid_location %}<p class="loc">{{ masjid_location }}</p>{% endif %}
    <button class="cta" id="openBtn" type="button">Open in Muslim 360</button>
    <a class="secondary" id="storeLink" href="{{ play_store_referrer_url }}">Get the app</a>
    <a class="home" href="{{ marketing_site_url }}">muslim360.app</a>
  </div>
</div>

<script>
  var PLAY_STORE_URL = {{ play_store_referrer_url | tojson }};
  var APP_STORE_URL = {{ app_store_url | tojson }};
  var ANDROID_PKG = {{ android_package | tojson }};
  var SHARE_HOST = {{ share_host | tojson }};
  var SHARE_ORIGIN = {{ share_origin | tojson }};
  var SHARE_SCHEME = SHARE_ORIGIN.indexOf("://") >= 0
    ? SHARE_ORIGIN.split("://")[0]
    : "https";
  var MASJID_ID = {{ masjid_id | tojson }};

  var UA = navigator.userAgent || "";
  var IS_ANDROID = /android/i.test(UA);
  var IS_IOS = /iphone|ipad|ipod/i.test(UA) ||
    (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);

  document.getElementById("storeLink").href =
    IS_IOS ? APP_STORE_URL : PLAY_STORE_URL;

  document.getElementById("openBtn").addEventListener("click", function () {
    if (IS_ANDROID) {
      // If the app opens, the page is hidden — cancel the store fallback.
      var fallback = setTimeout(function () {
        if (!document.hidden) window.location = PLAY_STORE_URL;
      }, 1200);
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) clearTimeout(fallback);
      }, { once: true });
      window.location = "intent://" + SHARE_HOST + "/m/" + MASJID_ID +
        "#Intent;scheme=" + SHARE_SCHEME + ";package=" + ANDROID_PKG +
        ";S.browser_fallback_url=" + encodeURIComponent(PLAY_STORE_URL) +
        ";end";
      return;
    }
    window.location = IS_IOS ? APP_STORE_URL : PLAY_STORE_URL;
  });
</script>
</body>
</html>
