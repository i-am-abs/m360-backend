{% extends "admin_base.html" %}
{% block page_title %}Add Masjid{% endblock %}
{% block title %}Add Masjid — Muslim360 Admin{% endblock %}

{% block page_content %}
{% set active_nav = 'masjids' %}

<div class="mb-6">
  <a href="/admin/masjids" class="text-sm text-gray-500 hover:text-gray-700">&larr; Back to Masjids</a>
</div>

<div class="max-w-2xl">
  <div class="rounded-xl border border-gray-200 bg-white shadow-sm">
    <div class="px-6 py-4 border-b border-gray-100">
      <h3 class="text-base font-semibold text-gray-900">New Masjid</h3>
    </div>
    <form method="post" action="/admin/masjids/create" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Name <span class="text-red-500">*</span></label>
        <input name="name" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Arabic Name</label>
        <input name="name_arabic" dir="rtl" class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
        <input name="address" class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary-500">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
          <input name="city" class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">State</label>
          <input name="state" class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary-500">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Latitude</label>
          <input name="lat" step="any" placeholder="18.9545" class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm font-mono focus:ring-2 focus:ring-primary-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Longitude</label>
          <input name="lng" step="any" placeholder="72.8332" class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm font-mono focus:ring-2 focus:ring-primary-500">
        </div>
      </div>
      <div class="flex gap-3 pt-4 border-t border-gray-100">
        <button type="submit" class="rounded-lg bg-primary-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-primary-700 transition">Create Masjid</button>
        <a href="/admin/masjids" class="rounded-lg border border-gray-300 bg-white px-6 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-50 transition">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
